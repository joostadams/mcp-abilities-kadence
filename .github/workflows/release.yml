# Bouwt op een versietag een installeerbare ZIP en hangt die aan de release.
#
# Waarom een eigen ZIP en niet de zipball van de tag: die zipball bevat ook
# .github/ en de git-metadata, en die horen niet in een plugin-map op een site.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # PUC vergelijkt de geïnstalleerde versie met de Version-header op de tag,
      # niet met de tagnaam. Staan die uit elkaar, dan verschijnt er domweg geen
      # update en zegt niets waarom. Falen bij het taggen is veel beter.
      - name: Tag en Version-header moeten overeenkomen
        run: |
          header="$(grep -m1 -E '^\s*\*\s*Version:' mcp-abilities-kadence.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$header" != "$tag" ]; then
            echo "::error::De plugin-header zegt Version: ${header}, maar de tag is ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "Versie ${header} komt overeen met ${GITHUB_REF_NAME}."

      # De versie staat op nog twee plekken. KADENCE_MCP_VERSION gaat mee in de
      # cache-busting en in check-access; Stable tag leest WordPress in het
      # detailvenster van de update. Liepen die uit elkaar, dan zei de site iets
      # anders dan de header.
      - name: Constante en Stable tag moeten ook overeenkomen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          constante="$(grep -m1 -E "define\( *'KADENCE_MCP_VERSION'" mcp-abilities-kadence.php | sed -E "s/.*'KADENCE_MCP_VERSION', *'([^']+)'.*/\1/")"
          stable="$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')"
          fout=0
          [ "$constante" = "$tag" ] || { echo "::error::KADENCE_MCP_VERSION is ${constante}, de tag is ${GITHUB_REF_NAME}."; fout=1; }
          [ "$stable" = "$tag" ] || { echo "::error::readme.txt heeft Stable tag: ${stable}, de tag is ${GITHUB_REF_NAME}."; fout=1; }
          exit $fout

      # Een syntaxfout gaat anders via de updateknop naar elke site.
      - name: PHP-syntax controleren
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      # Uitsluiten in plaats van insluiten, verankerd met een / zodat een map
      # met dezelfde naam binnen vendor/ niet per ongeluk wordt weggeknipt.
      #
      # CONTEXT.md is ontwikkeldocumentatie en tests/ een ontwikkelscript; geen
      # van beide hoort op een productiesite; in de repo blijven ze wel staan.
      # skill/ gaat juist wél mee: de plugin
      # serveert die map zelf als download onder Kadence Blocks -> MCP, en
      # zonder die bestanden meldt dat scherm dat de skillmap ontbreekt.
      - name: ZIP bouwen
        run: |
          mkdir -p dist/mcp-abilities-kadence
          rsync -a ./ dist/mcp-abilities-kadence/ \
            --exclude '.git' \
            --exclude '/.github' \
            --exclude '/dist' \
            --exclude '/.gitignore' \
            --exclude '/.gitattributes' \
            --exclude '/CONTEXT.md' \
            --exclude '/tests'
          cd dist && zip -qr mcp-abilities-kadence.zip mcp-abilities-kadence
          unzip -l mcp-abilities-kadence.zip | tail -5

      - name: Aan de release hangen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mcp-abilities-kadence.zip \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/mcp-abilities-kadence.zip --clobber
