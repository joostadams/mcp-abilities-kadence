# Lint op elke push en pull request, op de oudste en de nieuwste PHP die de
# plugin ondersteunt. De plugin staat lokaal als symlink in een site: één
# syntaxfout legt die meteen plat, en op een klantsite via de updateknop ook.
#
# Het gedrag toetst tests/smoke.php; die heeft WordPress met Kadence nodig en
# draait daarom lokaal (wp eval-file tests/smoke.php), niet hier.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l
